name: model-speed-test

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Number of real arXiv abstracts to test per model
        required: false
        default: "5"
      timeout_seconds:
        description: Per-request timeout in seconds
        required: false
        default: "180"

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: Test model speed with real abstracts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, statistics, urllib.request, urllib.error

          base_url = os.environ['OPENAI_BASE_URL'].rstrip('/')
          api_key = os.environ['OPENAI_API_KEY']
          sample_size = int(os.environ.get('SAMPLE_SIZE', '5'))
          timeout = int(os.environ.get('TIMEOUT_SECONDS', '180'))
          models = ['kimi-k2.6', 'qwen/qwen3-next-80b-a3b-thinking']

          files = sorted(pathlib.Path('data').glob('*.jsonl'), reverse=True)
          rows = []
          for f in files:
            if '_AI_enhanced_' in f.name:
              continue
            for line in f.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                continue
              item = json.loads(line)
              summary = (item.get('summary') or '').strip()
              if len(summary) > 400:
                rows.append({
                  'id': item.get('id'),
                  'title': item.get('title'),
                  'summary': summary,
                })
              if len(rows) >= sample_size:
                break
            if len(rows) >= sample_size:
              break

          print(f'base_url={base_url}')
          print(f'samples={len(rows)} timeout_seconds={timeout}')
          print('sample_ids=' + ','.join(str(r['id']) for r in rows))

          def call(model, content):
            payload = {
              'model': model,
              'messages': [
                {'role': 'system', 'content': 'You are a concise professional paper analyst. Output in Chinese.'},
                {'role': 'user', 'content': '请用中文用不超过120字总结这篇论文摘要，重点说明任务、方法、结果。\n\n' + content},
              ],
              'temperature': 0.2,
              'max_tokens': 220,
            }
            data = json.dumps(payload).encode('utf-8')
            req = urllib.request.Request(
              base_url + '/chat/completions',
              data=data,
              headers={
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + api_key,
              },
              method='POST',
            )
            start = time.perf_counter()
            with urllib.request.urlopen(req, timeout=timeout) as resp:
              body = resp.read()
              elapsed = time.perf_counter() - start
              obj = json.loads(body.decode('utf-8'))
              text = obj.get('choices', [{}])[0].get('message', {}).get('content', '')
              usage = obj.get('usage', {})
              return elapsed, len(text), usage

          for model in models:
            print(f'\nMODEL {model}')
            times = []
            ok = 0
            for idx, row in enumerate(rows, 1):
              try:
                elapsed, text_len, usage = call(model, row['summary'])
                times.append(elapsed)
                ok += 1
                print(f'  sample={idx} id={row["id"]} ok seconds={elapsed:.2f} output_chars={text_len} usage={usage}')
              except Exception as e:
                print(f'  sample={idx} id={row["id"]} error type={type(e).__name__} message={str(e)[:300]}')
            if times:
              print(f'SUMMARY model={model} ok={ok}/{len(rows)} mean={statistics.mean(times):.2f}s median={statistics.median(times):.2f}s min={min(times):.2f}s max={max(times):.2f}s')
            else:
              print(f'SUMMARY model={model} ok=0/{len(rows)}')
          PY
