name: model-speed-test

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Per-request timeout in seconds
        required: false
        default: "90"

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: Test qwen instruct speed with real abstract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          base_url = os.environ['OPENAI_BASE_URL'].rstrip('/')
          api_key = os.environ['OPENAI_API_KEY']
          timeout = int(os.environ.get('TIMEOUT_SECONDS', '90'))
          model = 'qwen/qwen3-next-80b-a3b-instruct'

          row = None
          for f in sorted(pathlib.Path('data').glob('*.jsonl'), reverse=True):
            if '_AI_enhanced_' in f.name:
              continue
            for line in f.read_text(encoding='utf-8').splitlines():
              item = json.loads(line)
              summary = (item.get('summary') or '').strip()
              if len(summary) > 400:
                row = {'id': item.get('id'), 'summary': summary}
                break
            if row:
              break

          payload = {
            'model': model,
            'messages': [
              {'role': 'system', 'content': 'You are a concise professional paper analyst. Output in Chinese.'},
              {'role': 'user', 'content': '请用中文用不超过120字总结这篇论文摘要，重点说明任务、方法、结果。\n\n' + row['summary']},
            ],
            'temperature': 0.2,
            'max_tokens': 220,
          }
          req = urllib.request.Request(
            base_url + '/chat/completions',
            data=json.dumps(payload).encode('utf-8'),
            headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + api_key},
            method='POST',
          )
          print(f'model={model}')
          print(f'sample_id={row["id"]} timeout_seconds={timeout}')
          start = time.perf_counter()
          try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
              body = resp.read()
              elapsed = time.perf_counter() - start
              obj = json.loads(body.decode('utf-8'))
              text = obj.get('choices', [{}])[0].get('message', {}).get('content', '')
              usage = obj.get('usage', {})
              print(f'ok seconds={elapsed:.2f} output_chars={len(text)} usage={usage}')
          except Exception as e:
            elapsed = time.perf_counter() - start
            print(f'error seconds={elapsed:.2f} type={type(e).__name__} message={str(e)[:300]}')
          PY
